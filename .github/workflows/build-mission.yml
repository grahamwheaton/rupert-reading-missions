name: Build mission

# The scheduled job that writes mission sources can push UTF-8 but not binary,
# so it pushes missions/<date>-<slug>/mission.html and this builds the MOBI.

on:
  push:
    branches: [master]
    paths:
      - 'missions/**'
      - 'tools/build-mission.py'
      - '.github/workflows/build-mission.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 'Mission directory to build (blank: the newest dated one)'
        required: false
        default: ''
      dry_run:
        description: 'Convert and validate only; publish nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-mission
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre
          python3 -m pip install --disable-pip-version-check Pillow cmudict
          ebook-convert --version

      - name: Build and publish the newest mission
        run: |
          # Keep sound guides available for all archived stories too.
          for source in missions/20??-??-??-*; do
            [ -f "$source/mission.html" ] || continue
            python3 tools/build-mission.py --source "$source" --phonics-only
          done
          # Rebuild edited past missions into the archive first. The builder
          # keeps today's date pointer intact for these corrections.
          set -o pipefail
          if [ -z "${{ inputs.source }}" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            git diff --name-only HEAD^ HEAD -- missions/ | cut -d/ -f2 | sort -u | while read -r folder; do
              case "$folder" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*) ;; *) continue ;; esac
              [ -f "missions/$folder/mission.html" ] || continue
              python3 tools/build-mission.py --source "missions/$folder"
            done
          fi
          python3 tools/build-mission.py \
            ${{ inputs.source && format('--source {0}', inputs.source) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit if the published mission changed
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain published/)" ]; then
            echo "published/ unchanged; nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published/
          git commit -m "Publish $(cat published/date.txt) reading mission"
          git push
